version: '3.8'

networks:
  real_estate_net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: real_estate_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: real_estate_dev
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - real_estate_net
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: real_estate_redis
    ports:
      - "6380:6379"
    networks:
      - real_estate_net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: real_estate_qdrant
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - real_estate_net
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: